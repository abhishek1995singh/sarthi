# List services *except* Render Postgres databases here
services:
  - type: web
    name: sarthi-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sarthi-db
          property: connectionString

databases:
  - name: sarthi-db
    plan: free
    databaseName: sarthi_db
    user: sarthi
    region: singapore
