services:
  - type: web
    name: sarthi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sarthi-db
          property: connectionString

databases:
  - name: sarthi-db
    plan: free
    databaseName: sarthi_db
    user: sarthi
