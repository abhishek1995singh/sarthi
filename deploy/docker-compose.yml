# Full Sarthi stack: Postgres + Spring API (preprod) + Nginx (Angular static + /api proxy)
# Usage (from repo root):
#   cp deploy/.env.example deploy/.env && edit deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: sarthi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sarthi_preprod}
      POSTGRES_USER: ${POSTGRES_USER:-sarthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - sarthi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sarthi} -d ${POSTGRES_DB:-sarthi_preprod}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sarthi-api
    environment:
      SPRING_PROFILES_ACTIVE: preprod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sarthi_preprod}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sarthi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in deploy/.env}
      STORAGE_LOCATION: /app/data/uploads
    volumes:
      - sarthi_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: sarthi-web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  sarthi_pgdata:
  sarthi_uploads:
